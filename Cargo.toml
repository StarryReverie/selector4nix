[workspace]
resolver = "3"
members = ["crates/*", "tests/*"]
default-members = ["crates/selector4nix"]

[workspace.package]
version = "0.9.1"
edition = "2024"
description = "Nix substituter proxy with parallel cache queries and latency-aware selection"
license = "GPL-3.0-or-later"
repository = "https://github.com/StarryReverie/selector4nix"
authors = ["Justin Chen"]
keywords = ["nix", "substituter", "proxy", "cache"]
categories = ["network-programming", "caching"]

[workspace.metadata.crane]
name = "selector4nix"

[workspace.dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
bytes = "1.11.1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6.2.1"
fastrand = "2.4.1"
futures = "0.3.32"
getset = "0.1.6"
http = "1.4.2"
minijinja = "2.21.0"
minijinja-autoreload = { version = "2.21.0", default-features = false, features = [] }
moka = { version = "0.12.15", features = ["future"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
redb = "4.1.0"
reqwest = { version = "0.13.2", features = ["stream"] }
rust-embed = { version = "8.12.0", features = ["deterministic-timestamps", "mime-guess"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snafu = "0.9.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-oslog = "0.3.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
tempfile = "3.27.0"
which = "8.0.0"
